<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Game</title>
    <link rel="icon" href="data:,">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        
        #game-canvas {
            display: block;
            width: min(100vw, 177.78vh);
            height: min(100vh, 56.25vw);
            background-color: #111;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 10;
        }
        
        .hidden {
            display: none;
        }
        
        #error {
            color: #ff4444;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading">Loading 4D Game...</div>
        <canvas id="game-canvas" class="hidden"></canvas>
        <div id="error"></div>
    </div>

    <script>
        // Emscripten module configuration
        var Module = {
            canvas: document.getElementById('game-canvas'),
            onRuntimeInitialized: function() {
                console.log('4D Game loaded successfully!');
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('game-canvas').classList.remove('hidden');
            },
            onError: function(error) {
                console.error('Error loading 4D Game:', error);
                document.getElementById('loading').textContent = 'Error loading game';
                document.getElementById('error').textContent = 'Failed to load the game. Please check your browser supports WebGL2.';
            }
        };

    </script>
    {{{ SCRIPT }}}
</body>
</html>
